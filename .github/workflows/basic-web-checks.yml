name: Basic Web Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-web-files:
    name: Check HTML, CSS, and JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required files exist
        run: |
          set -eu
          test -s index.html
          test -s style.css
          test -s script.js

      - name: Check basic HTML structure and linked files
        run: |
          set -eu
          grep -Eiq '<!doctype html>' index.html
          grep -Eiq '<html([[:space:]>])' index.html
          grep -Eiq '<head([[:space:]>])' index.html
          grep -Eiq '<body([[:space:]>])' index.html
          grep -Fq 'href="style.css"' index.html
          grep -Fq 'src="script.js"' index.html
          grep -Fq 'id="hello-button"' index.html
          grep -Fq 'id="greeting"' index.html

      - name: Check CSS has basic page and button styles
        run: |
          set -eu
          grep -Eq '(^|[[:space:]])body[[:space:]]*\{' style.css
          grep -Eq '(^|[[:space:]])button[[:space:]]*\{' style.css

      - name: Check JavaScript uses matching page elements
        run: |
          set -eu
          grep -Fq '#hello-button' script.js
          grep -Fq '#greeting' script.js
          grep -Fq 'addEventListener' script.js
